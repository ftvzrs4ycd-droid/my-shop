.top-categories { flex-shrink: 0; display: flex; overflow-x: auto; -webkit-overflow-scrolling: touch; background: #fff; border-bottom: 1px solid #f0f0f0; padding: 10px 6px; gap: 4px; scrollbar-width: none; scroll-behavior: smooth; }

.cart-page-wrap { position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 15px; padding-bottom: 160px; background: #f5f5f5; }

.cart-item { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid #f5f5f5; }
.cart-item img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; background: #f0f0f0; flex-shrink: 0; cursor: zoom-in; }

.qty-control { display: flex; align-items: center; gap: 8px; }

.cart-summary-bar {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  background: #fff;
  border-top: 1px solid #eee;

.summary-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #666; margin-bottom: 6px; }
.summary-row:last-of-type { margin-bottom: 12px; }

.summary-row .fee-val { color: #333; font-weight: 600; }
.summary-row .total-val { color: #ff5000; font-weight: bold; font-size: 18px; }
.checkout-btn { width: 100%; background: #ff5000; color: #fff; border: none; border-radius: 22px; padding: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }

#cartFloatBtn { position: absolute; bottom: 15px; right: 15px; width: 50px; height: 50px; background: #ff5000; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 4px 10px rgba(255,80,0,0.4); z-index: 150; cursor: pointer; }
#cartCount { position: absolute; top: -5px; right: -5px; background: #e53935; color: #fff; font-size: 10px; border-radius: 10px; padding: 1px 5px; min-width: 16px; text-align: center; }

.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 400; align-items: center; justify-content: center; padding: 20px; }
.modal.show { display: flex; }
.modal-content { background: #fff; border-radius: 12px; padding: 20px; width: 100%; max-width: 400px; max-height: 80vh; overflow-y: auto; }

#orderText { background: #f7f7f7; padding: 12px; border-radius: 8px; font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; margin-bottom: 12px; }

#imgPreview { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 999; align-items: center; justify-content: center; padding: 20px; cursor: zoom-out; }
#imgPreview.show { display: flex; }
#imgPreview img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; }
#imgPreview .close-hint { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.7); font-size: 13px; white-space: nowrap; }

#toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); background: rgba(0,0,0,0.78); color: #fff; font-size: 15px; padding: 12px 24px; border-radius: 10px; z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; white-space: nowrap; }
#toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

#orderImgModal .modal-content { max-height: 90vh; padding: 15px; text-align: center; }
#orderImgModal .tip { font-size: 13px; color: #999; margin-bottom: 10px; }
#orderImgPreview { width: 100%; display: block; border-radius: 8px; }
</style>

<div class="modal" id="orderModal">

    <button class="btn-primary" style="width:100%;padding:12px;border:none;border-radius:22px;font-size:15px;cursor:pointer;margin-bottom:8px;background:#fff;color:#ff5000;border:1px solid #ff5000;" onclick="copyOrder()">复制文字订单</button>

<script src="products.js?v=15"></script>

<script>
const SERVICE_FEE_PER_ITEM = 3;

let cart = JSON.parse(localStorage.getItem('mall_cart') || '{}');
let lastOrderText = '';
let currentPage = 'home';
let currentTopCatId = TOP_CATEGORIES[0].id;
let currentSubCatId = 101;
let searchKeyword = '';

let lastOrderData = null;

function init() {
  renderGridCategories();
  renderHomeProducts();
  renderTopCategories();
  renderCatSidebar();
  renderCatProducts();
  updateCartUI();
}

function switchPage(page) {
  currentPage = page;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelector(`.nav-item[data-page="${page}"]`).classList.add('active');
  
  document.getElementById('cartFloatBtn').style.display = page === 'cart' ? 'none' : 'flex';
  
  if (page === 'cart') renderCartPage();
  if (page === 'home') renderHomeProducts();
  if (page === 'category') {
    renderTopCategories();
    renderCatSidebar();
    renderCatProducts();
  }
}

function getQty(id) { return cart[id] || 0; }

function renderGridCategories() {
  document.getElementById('gridCategories').innerHTML = TOP_CATEGORIES.map(c => `
    <div class="grid-cat" onclick="switchPage('category');selectTopCat(${c.id})">
      <div class="icon-box">${c.icon}</div>
      <p>${c.name}</p>
    </div>
  `).join('');
}

function renderHomeProducts() {
  let list = PRODUCTS.filter(p => p.name.includes(searchKeyword));
  if (!searchKeyword) {
    list = list.sort((a, b) => b.sold - a.sold).slice(0, 6);
  } else {
    list = list.slice(0, 20);
  }
  if (!list.length) {
    document.getElementById('homeProductList').innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#999;padding:40px 0;">没有找到商品</div>';
    return;
  }
  document.getElementById('homeProductList').innerHTML = list.map(p => {
    const qty = getQty(p.id);
    return `
    <div class="product-card">
      ${p.isNew ? '<span class="new-tag">NEW</span>' : ''}
      <img src="${p.img}" alt="${p.name}" onclick="openImgPreview('${p.img}')" onerror="this.src='https://via.placeholder.com/200x200?text=商品图片'">
      <div class="info">
        <div class="name">${p.name}</div>
        <div class="sold">已售${p.sold}件</div>
        <div class="price-row">
          <div class="price"><small>¥</small>${p.price.toFixed(2)}</div>
          ${qty > 0 
            ? `<div class="qty-mini"><button onclick="changeQty(${p.id}, -1)">−</button><span>${qty}</span><button onclick="changeQty(${p.id}, 1)">+</button></div>`
            : `<button class="cart-btn" onclick="addToCart(${p.id})">+</button>`}
        </div>
      </div>
    </div>
  `}).join('');
}

function renderTopCategories() {
  document.getElementById('topCategories').innerHTML = TOP_CATEGORIES.map(c => `
    <div class="top-cat-item ${c.id === currentTopCatId ? 'active' : ''}" onclick="selectTopCat(${c.id})">
      <div class="tc-icon">${c.icon}</div>
      <p>${c.name}</p>
    </div>
  `).join('');
}

function selectTopCat(id) {
  currentTopCatId = id;
  const subs = SUB_CATEGORIES.filter(s => s.parentId === id);
  if (subs.length) currentSubCatId = subs[0].id;
  renderTopCategories();
  renderCatSidebar();
  renderCatProducts();
  
  setTimeout(function() {
    const container = document.getElementById('topCategories');
    const activeEl = container.querySelector('.top-cat-item.active');
    if (container && activeEl) {
      const targetScroll = activeEl.offsetLeft - (container.clientWidth / 2) + (activeEl.clientWidth / 2);
      container.scrollTo({ left: targetScroll, behavior: 'smooth' });
    }
  }, 50);
}

function renderCatSidebar() {
  const subs = SUB_CATEGORIES.filter(s => s.parentId === currentTopCatId);
  document.getElementById('catSidebar').innerHTML = subs.map(s => `
    <div class="cat-sidebar-item ${s.id === currentSubCatId ? 'active' : ''}" onclick="selectSubCat(${s.id})">${s.name}</div>
  `).join('');
}

function selectSubCat(id) {
  currentSubCatId = id;
  renderCatSidebar();
  renderCatProducts();
}

function renderCatProducts() {
  let list = PRODUCTS.filter(p => p.catId === currentTopCatId);
  const currentSub = SUB_CATEGORIES.find(s => s.id === currentSubCatId);
  if (currentSub && currentSub.name !== '全部') {
    list = list.filter(p => p.subCatId === currentSubCatId);
  }
  if (!list.length) {
    document.getElementById('catProductList').innerHTML = '<div style="text-align:center;color:#999;padding:40px 0;">该分类暂无商品</div>';
    return;
  }
  document.getElementById('catProductList').innerHTML = list.map(p => {
    const qty = getQty(p.id);
    return `
    <div class="cat-product-item">
      <img src="${p.img}" alt="${p.name}" onclick="openImgPreview('${p.img}')" onerror="this.src='https://via.placeholder.com/200x200?text=商品图片'">
      <div class="info">
        <div>
          <div class="name">${p.name}</div>
          <div class="meta">已售${p.sold}件 · 剩余${p.stock}件</div>
        </div>
        <div class="price-row">
          <div>
            <span class="price"><small>¥</small>${p.price.toFixed(2)}</span>
            <span style="font-size:11px;color:#999;text-decoration:line-through;margin-left:6px;">¥${p.oldPrice.toFixed(2)}</span>
          </div>
          ${qty > 0 
            ? `<div class="qty-mini-lg"><button onclick="changeQty(${p.id}, -1)">−</button><span>${qty}</span><button onclick="changeQty(${p.id}, 1)">+</button></div>`
            : `<button class="cart-btn" onclick="addToCart(${p.id})">+</button>`}
        </div>
      </div>
    </div>
  `}).join('');
}

function doSearch() {
  searchKeyword = document.getElementById('searchInput').value.trim();
  if (currentPage !== 'home') switchPage('home');
  renderHomeProducts();
}

function saveCart() {
  localStorage.setItem('mall_cart', JSON.stringify(cart));
  updateCartUI();
}

function addToCart(id) {
  cart[id] = (cart[id] || 0) + 1;
  saveCart();
  if (currentPage === 'home') renderHomeProducts();
  if (currentPage === 'category') renderCatProducts();
  if (currentPage === 'cart') renderCartPage();
}

function changeQty(id, delta) {
  if (!cart[id]) return;
  cart[id] += delta;
  if (cart[id] <= 0) delete cart[id];
  saveCart();
  if (currentPage === 'home') renderHomeProducts();
  if (currentPage === 'category') renderCatProducts();
  if (currentPage === 'cart') renderCartPage();
}

function cartItems() {
  return Object.entries(cart).map(([id, qty]) => {
    const p = PRODUCTS.find(x => x.id === +id);
    return { ...p, qty, subtotal: p.price * qty };
  });
}

function cartTotal() { return cartItems().reduce((s, i) => s + i.subtotal, 0); }
function cartQty() { return Object.values(cart).reduce((s, q) => s + q, 0); }
function serviceFee() { return cartQty() * SERVICE_FEE_PER_ITEM; }
function grandTotal() { return cartTotal() + serviceFee(); }

function updateCartUI() {
  const count = Object.values(cart).reduce((s, q) => s + q, 0);
  document.getElementById('cartCount').textContent = count;
}

function renderCartPage() {
  const items = cartItems();
  const container = document.getElementById('cartItemsPage');
  const summaryBar = document.getElementById('cartSummaryBar');
  
  if (!items.length) {
    container.innerHTML = '<div class="cart-empty">购物车是空的</div>';
    summaryBar.style.display = 'none';
  } else {
    let html = items.map(i => `
      <div class="cart-item">
        <img src="${i.img}" alt="${i.name}" onclick="openImgPreview('${i.img}')" onerror="this.src='https://via.placeholder.com/100x100?text=商品'">
        <div class="cart-item-info">
          <div class="cart-item-name">${i.name}</div>
          <div class="cart-item-price">¥${i.price.toFixed(2)}</div>
        </div>
        <div class="qty-control">
          <button onclick="changeQty(${i.id}, -1)">−</button>
          <span>${i.qty}</span>
          <button onclick="changeQty(${i.id}, 1)">+</button>
        </div>
        <div class="cart-item-subtotal">¥${i.subtotal.toFixed(2)}</div>
      </div>
    `).join('');
    container.innerHTML = html;
    
    summaryBar.style.display = 'block';
    document.getElementById('totalQty').textContent = cartQty();
    document.getElementById('feeUnit').textContent = SERVICE_FEE_PER_ITEM;
    document.getElementById('goodsTotal').textContent = cartTotal().toFixed(2);
    document.getElementById('feeTotal').textContent = serviceFee().toFixed(2);
    document.getElementById('grandTotal').textContent = grandTotal().toFixed(2);
  }
  updateCartUI();
}

function openCheckout() {
  if (!Object.keys(cart).length) { alert('购物车是空的'); return; }
  generateOrder();
}

function generateOrder() {
  const orderNo = String(Math.floor(10000 + Math.random() * 90000));
  const items = cartItems();
  const goodsTotal = cartTotal();
  const qty = cartQty();
  const fee = serviceFee();
  const total = grandTotal();
  const timeStr = new Date().toLocaleString('zh-CN');
  
  lastOrderData = {
    orderNo: orderNo,
    timeStr: timeStr,
    items: items.map(i => ({ img: i.img, name: i.name, qty: i.qty, subtotal: i.subtotal })),
    goodsTotal: goodsTotal,
    qty: qty,
    fee: fee,
    total: total
  };
  
  const lines = [];
  lines.push('订单号：' + orderNo);
  lines.push('--------------------');
  items.forEach((i, idx) => {
    lines.push(`${idx + 1}. ${i.name} x${i.qty} = ¥${i.subtotal.toFixed(2)}`);
  });
  lines.push('--------------------');
  lines.push('商品金额（共' + qty + '件）：¥' + goodsTotal.toFixed(2));
  lines.push('代购费（¥' + SERVICE_FEE_PER_ITEM + '/件 × ' + qty + '件）：¥' + fee.toFixed(2));
  lines.push('--------------------');
  lines.push('合计：¥' + total.toFixed(2));
  lines.push('下单时间：' + timeStr);
  
  lastOrderText = lines.join('\n');
  document.getElementById('orderText').textContent = lastOrderText;
  document.getElementById('orderModal').classList.add('show');
  
  cart = {};
  saveCart();
  if (currentPage === 'home') renderHomeProducts();
  if (currentPage === 'category') renderCatProducts();
  renderCartPage();
}

function closeOrderModal() {
  document.getElementById('orderModal').classList.remove('show');
}

async function generateOrderImage() {
  if (!lastOrderData) { showToast('没有订单数据'); return; }
  const data = lastOrderData;
  
  showToast('正在生成图片...');
  
  const W = 750;
  const rowH = 140;
  const headerH = 130;
  const footerH = 260;
  const H = headerH + data.items.length * rowH + footerH + 60;
  
  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');
  
  ctx.fillStyle = '#f5f5f5';
  ctx.fillRect(0, 0, W, H);
  
  ctx.fillStyle = '#fff';
  ctx.fillRect(20, 20, W - 40, H - 40);
  
  ctx.fillStyle = '#ff5000';
  ctx.fillRect(20, 20, W - 40, 10);
  
  ctx.fillStyle = '#333';
  ctx.font = 'bold 34px -apple-system, sans-serif';
  ctx.fillText('订单号：' + data.orderNo, 50, 90);
  
  ctx.fillStyle = '#999';
  ctx.font = '24px -apple-system, sans-serif';
  ctx.fillText(data.timeStr, 50, 128);
  
  ctx.strokeStyle = '#f0f0f0';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(50, headerH + 20);
  ctx.lineTo(W - 50, headerH + 20);
  ctx.stroke();
  
  const imgPromises = data.items.map(item => loadImage(item.img));
  const imgs = await Promise.all(imgPromises);
  
  let y = headerH + 50;
  const imgSize = 100;
  data.items.forEach((item, idx) => {
    const img = imgs[idx];
    const imgX = 50;
    const imgY = y;
    
    ctx.save();
    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(imgX, imgY, imgSize, imgSize, 10);
    } else {
      ctx.rect(imgX, imgY, imgSize, imgSize);
    }
    ctx.clip();
    if (img) {
      try { ctx.drawImage(img, imgX, imgY, imgSize, imgSize); } catch(e) { drawPlaceholder(ctx, imgX, imgY, imgSize, imgSize); }
    } else {
      drawPlaceholder(ctx, imgX, imgY, imgSize, imgSize);
    }
    ctx.restore();
    
    const nameX = imgX + imgSize + 24;
    ctx.fillStyle = '#333';
    ctx.font = 'bold 28px -apple-system, sans-serif';
    let name = item.name;
    if (name.length > 16) name = name.substring(0, 16) + '...';
    ctx.fillText(name, nameX, imgY + 40);
    
    ctx.fillStyle = '#999';
    ctx.font = '26px -apple-system, sans-serif';
    ctx.fillText('x' + item.qty, nameX, imgY + 82);
    
    ctx.fillStyle = '#ff5000';
    ctx.font = 'bold 30px -apple-system, sans-serif';
    const subtotalText = '¥' + item.subtotal.toFixed(2);
    const subtotalW = ctx.measureText(subtotalText).width;
    ctx.fillText(subtotalText, W - 50 - subtotalW, imgY + 62);
    
    y += rowH;
    
    if (idx < data.items.length - 1) {
      ctx.strokeStyle = '#f5f5f5';
      ctx.beginPath();
      ctx.moveTo(50, y - 20);
      ctx.lineTo(W - 50, y - 20);
      ctx.stroke();
    }
  });
  
  y += 10;
  ctx.strokeStyle = '#e8e8e8';
  ctx.beginPath();
  ctx.moveTo(50, y);
  ctx.lineTo(W - 50, y);
  ctx.stroke();
  
  y += 60;
  ctx.fillStyle = '#666';
  ctx.font = '26px -apple-system, sans-serif';
  ctx.fillText('商品金额（共' + data.qty + '件）', 50, y);
  ctx.fillStyle = '#333';
  ctx.font = 'bold 26px -apple-system, sans-serif';
  let txt = '¥' + data.goodsTotal.toFixed(2);
  let tw = ctx.measureText(txt).width;
  ctx.fillText(txt, W - 50 - tw, y);
  
  y += 50;
  ctx.fillStyle = '#666';
  ctx.font = '26px -apple-system, sans-serif';
  ctx.fillText('代购费（¥' + SERVICE_FEE_PER_ITEM + '/件 × ' + data.qty + '件）', 50, y);
  ctx.fillStyle = '#333';
  ctx.font = 'bold 26px -apple-system, sans-serif';
  txt = '¥' + data.fee.toFixed(2);
  tw = ctx.measureText(txt).width;
  ctx.fillText(txt, W - 50 - tw, y);
  
  y += 70;
  ctx.fillStyle = '#333';
  ctx.font = 'bold 32px -apple-system, sans-serif';
  ctx.fillText('合计', 50, y);
  ctx.fillStyle = '#ff5000';
  ctx.font = 'bold 44px -apple-system, sans-serif';
  txt = '¥' + data.total.toFixed(2);
  tw = ctx.measureText(txt).width;
  ctx.fillText(txt, W - 50 - tw, y);
  
  y += 60;
  ctx.fillStyle = '#bbb';
  ctx.font = '22px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('长按图片保存，发微信给代购', W / 2, y);
  ctx.textAlign = 'left';
  
  try {
    const dataUrl = canvas.toDataURL('image/png');
    closeOrderModal();
    showOrderImage(dataUrl);
  } catch (e) {
    showToast('生成图片失败：' + e.message);
  }
}

function drawPlaceholder(ctx, x, y, w, h) {
  ctx.fillStyle = '#f0f0f0';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#ccc';
  ctx.font = '20px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('图片', x + w/2, y + h/2 + 7);
  ctx.textAlign = 'left';
}

function loadImage(src) {
  return new Promise((resolve) => {
    if (!src) { resolve(null); return; }
    const img = new Image();
    img.crossOrigin = 'anonymous';
    let done = false;
    img.onload = () => { if (!done) { done = true; resolve(img); } };
    img.onerror = () => { if (!done) { done = true; resolve(null); } };
    setTimeout(() => { if (!done) { done = true; resolve(null); } }, 10000);
    img.src = src;
  });
}

function showOrderImage(dataUrl) {
  document.getElementById('orderImgPreview').src = dataUrl;
  document.getElementById('orderImgModal').classList.add('show');
}

function closeOrderImg() {
  document.getElementById('orderImgModal').classList.remove('show');
}

function copyOrder() {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(lastOrderText).then(function(){
      showToast('已复制');
    }).catch(function(){ fallbackCopyOrder(); });
  } else {
    fallbackCopyOrder();
  }
}

function fallbackCopyOrder() {
  const ta = document.createElement('textarea');
  ta.value = lastOrderText;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); showToast('已复制'); } catch (e) { showToast('复制失败，请手动复制'); }
  document.body.removeChild(ta);
}

function copyWechat() {
  var wx = 'dageni2013';
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(wx).then(function(){
      showToast('已复制微信号：' + wx);
    }).catch(function(){ fallbackCopyWx(wx); });
  } else {
    fallbackCopyWx(wx);
  }
}
function fallbackCopyWx(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); showToast('已复制微信号：' + text); } catch (e) { showToast('复制失败，请手动长按复制'); }
  document.body.removeChild(ta);
}

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

function openImgPreview(src) {
  document.getElementById('imgPreviewSrc').src = src;
  document.getElementById('imgPreview').classList.add('show');
}
function closeImgPreview() {
  document.getElementById('imgPreview').classList.remove('show');
}

init();
</script>
