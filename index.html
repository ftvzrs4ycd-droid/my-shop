function saveDataCache() {

}

function tryRestoreCache() {

    if (!raw) return false;
    var d = JSON.parse(raw);
    if (!d.TOP_CATEGORIES || !d.TOP_CATEGORIES.length) return false;

}

window.__decryptWaiters = window.__decryptWaiters || {};
window.__decryptDone = function(key) {
  const w = window.__decryptWaiters;
  if (w[key] && Array.isArray(w[key])) {
    w[key].forEach(cb => { try { cb(); } catch(e) {} });
    delete w[key];
  } else if (w[key] !== 'done') {
    w[key] = 'done';
  }
};
function waitDecrypt(key) {
  return new Promise(resolve => {
    const w = window.__decryptWaiters;
    if (w[key] === 'done') { resolve(); return; }
    if (!Array.isArray(w[key])) w[key] = [];
    w[key].push(resolve);
  });
}

const ORDERS_KEY = 'mall_orders_v3';
const ORDER_KEEP_MS = 3 * 24 * 60 * 60 * 1000;
const ORDER_MAX = 30;
const ORDER_WITH_IMG_MAX = 5;

function loadOrders() {
  try {
    const data = JSON.parse(localStorage.getItem(ORDERS_KEY) || '[]');
    const now = Date.now();
    const keep = data.filter(o => (now - o.timestamp) < ORDER_KEEP_MS);
    if (keep.length !== data.length) {
      try { localStorage.setItem(ORDERS_KEY, JSON.stringify(keep)); } catch(e) {}
    }
    return keep;
  } catch (e) { return []; }
}

function saveOrderRecord(order) {
  let list = loadOrders();
  list = list.filter(o => o.orderNo !== order.orderNo);
  list.unshift(order);
  if (list.length > ORDER_MAX) list = list.slice(0, ORDER_MAX);
  list.forEach((o, i) => { if (i >= ORDER_WITH_IMG_MAX) delete o.imageBase64; });
  try { localStorage.setItem(ORDERS_KEY, JSON.stringify(list)); }
  catch (e) {
    list.forEach(o => { delete o.imageBase64; });
    try { localStorage.setItem(ORDERS_KEY, JSON.stringify(list)); } catch(e2) {}
  }
}

function attachOrderImage(orderNo, base64) {
  let list = loadOrders();
  const idx = list.findIndex(o => o.orderNo === orderNo);
  if (idx === -1) return;
  list[idx].imageBase64 = base64;
  let imgCount = 0;
  list.forEach(o => {
    if (o.imageBase64) { imgCount++; if (imgCount > ORDER_WITH_IMG_MAX) delete o.imageBase64; }
  });
  try { localStorage.setItem(ORDERS_KEY, JSON.stringify(list)); }
  catch (e) {
    list.forEach(o => { delete o.imageBase64; });
    try { localStorage.setItem(ORDERS_KEY, JSON.stringify(list)); } catch(e2) {}
  }
}

function deleteOrderRecord(orderNo) {
  const list = loadOrders().filter(o => o.orderNo !== orderNo);

  renderOrders();

function loadCatProducts(catId) {
  return new Promise((resolve) => {
    if (LOADED_CATS[catId]) { resolve(); return; }
    const fileName = CAT_FILE_NAMES[catId];
    if (!fileName) { LOADED_CATS[catId] = true; resolve(); return; }
    const readyPromise = waitDecrypt(fileName);
    const script = document.createElement('script');
    script.src = fileName + '?v=' + DATA_VERSION;
    script.onload = () => {
      Promise.race([readyPromise, new Promise(r => setTimeout(r, 30000))]).then(() => {
        LOADED_CATS[catId] = true;
        let rawList = window['PRODUCTS_CAT_' + catId];
        if (!rawList) { try { rawList = eval('PRODUCTS_CAT_' + catId); } catch(e) { rawList = []; } }
        rawList = rawList || [];
        rawList.forEach(p => {
          const globalId = catId * 100000 + p.id;
          if (!PRODUCTS.find(x => x.id === globalId)) PRODUCTS.push({ ...p, id: globalId, catId: catId });
        });
        saveDataCache();
        resolve();
      });
    };
    script.onerror = () => { resolve(); };
    document.head.appendChild(script);
  });
}

async function init() {
  const mask = document.getElementById('loadingMask');
  const slowTipTimer = setTimeout(() => {
    const tip = document.getElementById('loadingTip');
    if (tip) tip.style.display = 'block';
  }, 6000);

  function renderAll() {
    currentTopCatId = TOP_CATEGORIES[0].id;
    renderGridCategories(); renderTopCategories(); renderCatSidebar();
    updateCartUI(); renderOrders();
    setTimeout(bindHiddenTrigger, 300);
    if (!document.getElementById('searchInput').__liveSearchBound) {
      bindLiveSearch();
      document.getElementById('searchInput').__liveSearchBound = true;
    }
    renderHomeProducts(); renderCatProducts();
    updateProductCount();
  }

  const hasCache = tryRestoreCache();
  if (hasCache) {
    clearTimeout(slowTipTimer);
    if (mask) mask.style.display = 'none';
    renderAll();
    loadMainProducts().then(() => {
      saveDataCache();
      renderAll();
      warmUpAllCategories();
      handleDirectLink();
    }).catch(() => { handleDirectLink(); });
    return;
  }

  async function tryLoadOnce() {
    try {
      await Promise.race([
        loadMainProducts(),
        new Promise((_, rej) => setTimeout(() => rej(new Error('超时')), 15000))
      ]);
      return !!window.TOP_CATEGORIES;
    } catch (e) { return false; }
  }

  let ok = false;
  for (let i = 0; i < 3; i++) {
    ok = await tryLoadOnce();
    if (ok) break;
    if (i < 2) {
      if (mask) {
        mask.innerHTML = '<div style="text-align:center;padding:24px;">' +
          '<div style="width:40px;height:40px;border:3px solid #f0f0f0;border-top-color:#ff5000;border-radius:50%;animation:lspin 0.8s linear infinite;margin:0 auto;"></div>' +
          '<div style="margin-top:16px;color:#999;font-size:14px;">网络较慢，重试中... (' + (i + 1) + '/2)</div>' +
        '</div>';
      }
      await new Promise(r => setTimeout(r, 1500));
    }
  }

  if (!ok) {
    clearTimeout(slowTipTimer);
    if (mask) {
      mask.innerHTML = '<div style="text-align:center;padding:24px;">' +
        '<div style="color:#999;font-size:14px;margin-bottom:16px;">加载失败，请检查网络</div>' +
        '<button id="retryBtn" style="background:#ff5000;color:#fff;border:none;padding:12px 32px;border-radius:22px;font-size:15px;cursor:pointer;">重新加载</button>' +
      '</div>';
      document.getElementById('retryBtn').onclick = function() {
        location.reload();
      };
    }
    return;
  }

  clearTimeout(slowTipTimer);
  if (mask) mask.style.display = 'none';
  renderAll();
  saveDataCache();
  await loadCatProducts(TOP_CATEGORIES[0].id);
  renderCatProducts();
  saveDataCache();
  warmUpAllCategories();

  handleDirectLink();
}

let hiddenTriggerBound = false;
function bindHiddenTrigger() {
  if (hiddenTriggerBound) return;
  const el = document.getElementById('totalRow');
  if (!el) { setTimeout(bindHiddenTrigger, 500); return; }
  hiddenTriggerBound = true;
  el.style.userSelect = 'none'; el.style.webkitUserSelect = 'none'; el.style.webkitTouchCallout = 'none'; el.style.cursor = 'pointer';
  let timer = null, startX = 0, startY = 0, hasMoved = false;
  const start = (e) => {
    const t = e.touches ? e.touches[0] : e;
    startX = t.clientX; startY = t.clientY; hasMoved = false;
    el.style.transition = 'all 0.15s'; el.style.transform = 'scale(1.05)'; el.style.color = '#ff5000';
    if (timer) clearTimeout(timer);
    timer = setTimeout(() => {
      timer = null;
      if (navigator.vibrate) { try { navigator.vibrate(80); } catch(e) {} }
      el.style.transform = ''; el.style.color = ''; openPwdModal();
    }, 800);
  };
  const move = (e) => {
    if (hasMoved) return;
    const t = e.touches ? e.touches[0] : e;
    if (Math.abs(t.clientX - startX) > 15 || Math.abs(t.clientY - startY) > 15) { hasMoved = true; cancel(); }
  };
  const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } el.style.transform = ''; el.style.color = ''; };
  el.addEventListener('touchstart', start, { passive: true });
  el.addEventListener('touchmove', move, { passive: true });
  el.addEventListener('touchend', cancel); el.addEventListener('touchcancel', cancel);
  el.addEventListener('mousedown', start); el.addEventListener('mousemove', move);
  el.addEventListener('mouseup', cancel); el.addEventListener('mouseleave', cancel);
  el.addEventListener('contextmenu', (e) => e.preventDefault());
}

async function generatePromoImage() {
  const items = cartItems();
  if (!items.length) { showToast('购物车是空的'); return; }
  showToast('正在生成宣传图...');
  const W = 900, cols = 2, gap = 22, padding = 30;
  const cellW = Math.floor((W - padding * 2 - gap * (cols - 1)) / cols);
  const imgH = cellW, cellH = imgH;
  const rows = Math.ceil(items.length / cols);
  const footerH = 240;
  const H = 30 + rows * (cellH + gap) + footerH;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);

  const imgs = await Promise.all(items.map(item => loadImage(thumb(item.img, 500))));
  items.forEach((item, idx) => {
    const col = idx % cols, row = Math.floor(idx / cols);
    const x = padding + col * (cellW + gap);
    const y = 30 + row * (cellH + gap);
    ctx.save();
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, cellW, imgH, 14); else ctx.rect(x, y, cellW, imgH);
    ctx.clip();
    const img = imgs[idx];
    if (img) { try { const scale = Math.max(cellW / img.width, imgH / img.height); const dw = img.width * scale, dh = img.height * scale; ctx.drawImage(img, x + (cellW - dw) / 2, y + (imgH - dh) / 2, dw, dh); } catch (e) {} }
    else { ctx.fillStyle = '#f5f5f5'; ctx.fillRect(x, y, cellW, imgH); }
    ctx.restore();
  });

  const footerY = H - footerH;
  const grad2 = ctx.createLinearGradient(0, footerY, W, H);
  grad2.addColorStop(0, PROMO_FOOTER_COLOR_1);
  grad2.addColorStop(1, PROMO_FOOTER_COLOR_2);
  ctx.fillStyle = grad2; ctx.fillRect(0, footerY, W, footerH);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 46px -apple-system, "PingFang SC", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(PROMO_TEXT_MAIN, 60, footerY + 110);
  ctx.font = '26px -apple-system, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fillText(PROMO_TEXT_SUB, 60, footerY + 165);

  try {
    const qrImg = await loadImage(QR_IMAGE_URL);
    if (qrImg) {
      const qrSize = 150;
      const qrPad = 10;
      const qrBox = qrSize + qrPad * 2;
      const qrX = W - 60 - qrSize;
      const qrY = footerY + (footerH - qrSize) / 2;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(qrX - qrPad, qrY - qrPad, qrBox, qrBox, 14);
      else ctx.rect(qrX - qrPad, qrY - qrPad, qrBox, qrBox);
      ctx.fill();
      ctx.drawImage(qrImg, qrX, qrY, qrSize, qrSize);
    }
  } catch (e) {}

  try {
    const dataUrl = canvas.toDataURL('image/png');
    document.getElementById('promoPreview').src = dataUrl;
    document.getElementById('promoHint').textContent = '共 ' + items.length + ' 件商品（来自购物车）';
    document.getElementById('promoModal').classList.add('show');
  } catch (e) { showToast('生成失败：' + e.message); }
}

function wrapText(ctx, text, maxWidth, maxLines) {
  const lines = []; let current = '';
  for (let i = 0; i < text.length; i++) {
    const test = current + text[i];
    if (ctx.measureText(test).width > maxWidth && current.length > 0) {
      lines.push(current); current = text[i];
      if (lines.length >= maxLines - 1) {
        let rest = text.substring(i);
        while (ctx.measureText(rest + '…').width > maxWidth && rest.length > 0) rest = rest.substring(0, rest.length - 1);
        lines.push(rest + '…'); return lines;
      }
    } else current = test;
  }
  if (current) lines.push(current);
  return lines;
}

// ★ 新增：忽略空格和大小写的搜索文本
function normalizeSearchText(str) {
  if (!str) return '';
  return String(str).toLowerCase().replace(/\s+/g, '');
}

// ★ 获取商品的分类路径文本，如 "🥩 肉类 · 全部"
function getProductCategoryLabel(p) {
  const top = TOP_CATEGORIES.find(c => String(c.id) === String(p.catId));
  const sub = SUB_CATEGORIES.find(s => s.id === p.subCatId);
  const parts = [];
  if (top) parts.push((top.icon || '') + ' ' + top.name);
  if (sub) parts.push(sub.name);

  // 第二子分类（可能跨大分类）
  if (p.subCatId2) {
    const top2 = TOP_CATEGORIES.find(c => String(c.id) === String(p.catId));
    const sub2 = SUB_CATEGORIES.find(s => s.id === p.subCatId2);
    if (sub2) {
      const topOfSub2 = TOP_CATEGORIES.find(c => String(c.id) === String(sub2.parentId));
      if (topOfSub2 && String(topOfSub2.id) !== String(p.catId)) {
        // 跨大分类：显示 "· 其他大分类 > 子分类"
        parts.push('➕ ' + (topOfSub2.icon || '') + topOfSub2.name + ' · ' + sub2.name);
      } else if (sub2.id !== p.subCatId) {
        // 同大分类下第二个子分类
        parts.push('➕ ' + sub2.name);
      }
    }
  }
  return parts.join(' · ');
}

function bindCatScroll() {
  const container = document.getElementById('catProductList');
  if (!container) return;
  if (catScrollHandler) container.removeEventListener('scroll', catScrollHandler);
  catScrollHandler = function() {
    if (catRenderOffset >= currentCatProducts.length) return;
    const nearBottom = container.scrollTop + container.clientHeight > container.scrollHeight - 400;
    if (nearBottom) { const more = document.getElementById('catLoadMore'); if (more) more.remove(); renderCatProductsPage(true); }
  };
  container.addEventListener('scroll', catScrollHandler, { passive: true });
}

function addToCart(id) {
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;
  if (!cart[id]) cart[id] = { id: p.id, name: p.name, img: p.img, price: p.price, qty: 0 };
  cart[id].qty += 1;
  saveCart();
  if (currentPage === 'home' || currentPage === 'category') updateBtnAreas(id);
  else if (currentPage === 'cart') renderCartPage();
}

function changeQty(id, delta) {
  if (!cart[id]) return;
  cart[id].qty += delta;
  if (cart[id].qty <= 0) delete cart[id];
  saveCart();
  if (currentPage === 'home' || currentPage === 'category') updateBtnAreas(id);
  else if (currentPage === 'cart') renderCartPage();
}

function clearCart() {
  if (!Object.keys(cart).length) { showToast('购物车已经是空的'); return; }
  if (!confirm('确定要清空购物车里的所有商品吗？')) return;
  cart = {};
  saveCart();
  renderCartPage();
  showToast('购物车已清空');
}

function generateOrder() {
  const orderNo = String(Math.floor(10000 + Math.random() * 90000));
  const items = cartItems();
  const goodsTotal = cartTotal(), qty = cartQty(), fee = serviceFee(), total = grandTotal();
  const timeStr = new Date().toLocaleString('zh-CN');
  lastOrderData = { orderNo, timeStr, items: items.map(i => ({ id: i.id, img: i.img, name: i.name, qty: i.qty, price: i.price, subtotal: i.subtotal })), goodsTotal, qty, fee, total };
  const lines = [];
  lines.push('订单号：' + orderNo); lines.push('--------------------');
  items.forEach((i, idx) => lines.push(`${idx + 1}. ${i.name} x${i.qty} = ¥${i.subtotal.toFixed(2)}`));
  lines.push('--------------------');
  lines.push('商品金额（共' + qty + '件）：¥' + goodsTotal.toFixed(2));
  lines.push('代购费（¥' + SERVICE_FEE_PER_ITEM + '/件 × ' + qty + '件）：¥' + fee.toFixed(2));
  lines.push('--------------------');
  lines.push('合计：¥' + total.toFixed(2));
  lines.push('下单时间：' + timeStr);
  lastOrderText = lines.join('\n');
  setTimeout(generateOrderImage, 100);
  saveOrderRecord({
    orderNo, timestamp: Date.now(), timeStr,
    items: items.map(i => ({ id: i.id, name: i.name, qty: i.qty, price: i.price, subtotal: i.subtotal, img: i.img })),
    goodsTotal, qty, fee, total
  });
  cart = {};
  saveCart();
  if (currentPage === 'home') renderHomeProducts();
  if (currentPage === 'category') renderCatProducts();
  renderCartPage();
}

async function generateOrderImage() {
  if (!lastOrderData) { showToast('没有订单数据'); return; }
  const data = lastOrderData;
  showToast('正在生成图片...');
  const W = 750, padding = 40, gap = 20, cols = 2;
  const cardW = Math.floor((W - padding * 2 - gap * (cols - 1)) / cols);
  const imgH = cardW, nameH = 90, priceH = 60, cardH = imgH + nameH + priceH;
  const rowGap = 24, headerH = 130, topOffset = headerH + 50;
  const rows = Math.ceil(data.items.length / cols);
  const listH = rows * cardH + (rows - 1) * rowGap;
  const H = topOffset + listH + 20 + 60 + 50 + 70 + 50 + 60 + 40;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#f5f5f5'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff'; ctx.fillRect(20, 20, W - 40, H - 40);
  ctx.fillStyle = '#ff5000'; ctx.fillRect(20, 20, W - 40, 10);
  ctx.fillStyle = '#333';
  ctx.font = 'bold 34px -apple-system, sans-serif';
  ctx.fillText('订单号：' + data.orderNo, 50, 90);
  ctx.fillStyle = '#999';
  ctx.font = '24px -apple-system, sans-serif';
  ctx.fillText(data.timeStr, 50, 128);
  ctx.strokeStyle = '#f0f0f0'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(50, headerH + 20); ctx.lineTo(W - 50, headerH + 20); ctx.stroke();
  const imgs = await Promise.all(data.items.map(item => loadImage(thumb(item.img, 500))));
  data.items.forEach((item, idx) => {
    const col = idx % cols, row = Math.floor(idx / cols);
    const x = padding + col * (cardW + gap);
    const y = topOffset + row * (cardH + rowGap);
    ctx.save();
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, cardW, imgH, 14); else ctx.rect(x, y, cardW, imgH);
    ctx.clip();
    const img = imgs[idx];
    if (img) { try { const scale = Math.max(cardW / img.width, imgH / img.height); const dw = img.width * scale, dh = img.height * scale; ctx.drawImage(img, x + (cardW - dw) / 2, y + (imgH - dh) / 2, dw, dh); } catch (e) { ctx.fillStyle = '#f5f5f5'; ctx.fillRect(x, y, cardW, imgH); } }
    else { ctx.fillStyle = '#f5f5f5'; ctx.fillRect(x, y, cardW, imgH); }
    ctx.restore();
    ctx.fillStyle = '#333';
    ctx.font = 'bold 24px -apple-system, "PingFang SC", sans-serif';
    ctx.textAlign = 'left';
    const lines = wrapText(ctx, item.name, cardW - 10, 2);
    lines.forEach((line, li) => { ctx.fillText(line, x + 5, y + imgH + 38 + li * 32); });

    const priceY = y + imgH + nameH + 30;
    const unitPrice = item.price !== undefined ? item.price : (item.subtotal / (item.qty || 1));
    ctx.fillStyle = '#999';
    ctx.font = '18px -apple-system, sans-serif';
    ctx.fillText('¥' + unitPrice.toFixed(2) + ' × ' + item.qty, x + 5, priceY - 25);

    ctx.fillStyle = '#ff5000';
    ctx.font = 'bold 32px -apple-system, sans-serif';
    ctx.fillText('¥' + item.subtotal.toFixed(2), x + 5, priceY);

    const qtyTxt = '×' + item.qty;
    ctx.font = 'bold 30px -apple-system, "PingFang SC", sans-serif';
    const qtyTextW = ctx.measureText(qtyTxt).width;
    const badgeH = 48;
    const badgeW = qtyTextW + 32;
    const badgeX = x + cardW - badgeW - 5;
    const badgeY = priceY - badgeH + 12;
    ctx.fillStyle = '#ff5000';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(badgeX, badgeY, badgeW, badgeH, badgeH / 2);
    else ctx.rect(badgeX, badgeY, badgeW, badgeH);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'left';
    ctx.fillText(qtyTxt, badgeX + 16, badgeY + badgeH / 2 + 11);
  });
  let y = topOffset + listH + 20;
  ctx.strokeStyle = '#e8e8e8'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(50, y); ctx.lineTo(W - 50, y); ctx.stroke();
  y += 60;
  ctx.fillStyle = '#666';
  ctx.font = '26px -apple-system, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('商品金额（共' + data.qty + '件）', 50, y);
  ctx.fillStyle = '#333';
  ctx.font = 'bold 26px -apple-system, sans-serif';
  let txt = '¥' + data.goodsTotal.toFixed(2);
  ctx.fillText(txt, W - 50 - ctx.measureText(txt).width, y);
  y += 50;
  ctx.fillStyle = '#666';
  ctx.font = '26px -apple-system, sans-serif';
  ctx.fillText('代购费（¥' + SERVICE_FEE_PER_ITEM + '/件 × ' + data.qty + '件）', 50, y);
  ctx.fillStyle = '#333';
  ctx.font = 'bold 26px -apple-system, sans-serif';
  txt = '¥' + data.fee.toFixed(2);
  ctx.fillText(txt, W - 50 - ctx.measureText(txt).width, y);
  y += 70;
  ctx.fillStyle = '#333';
  ctx.font = 'bold 32px -apple-system, sans-serif';
  ctx.fillText('合计', 50, y);
  ctx.fillStyle = '#ff5000';
  ctx.font = 'bold 44px -apple-system, sans-serif';
  txt = '¥' + data.total.toFixed(2);
  ctx.fillText(txt, W - 50 - ctx.measureText(txt).width, y);
  y += 50;

  ctx.font = '20px -apple-system, "PingFang SC", sans-serif';
  const tipParts = [
    { t: '温馨提示：部分商品按', c: '#999' },
    { t: '定金', c: '#ff5000' },
    { t: '收取，最终以门店实际结算为准，', c: '#999' },
    { t: '多退少补', c: '#ff5000' }
  ];
  const tipW = tipParts.reduce((s, p) => s + ctx.measureText(p.t).width, 0);
  let tipX = (W - tipW) / 2;
  tipParts.forEach(p => {
    ctx.fillStyle = p.c;
    ctx.fillText(p.t, tipX, y);
    tipX += ctx.measureText(p.t).width;
  });

  y += 60;
  ctx.fillStyle = '#bbb';
  ctx.font = '22px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('长按图片保存，发微信给代购', W / 2, y);
  ctx.textAlign = 'left';
  try {
    const dataUrl = canvas.toDataURL('image/png');
    attachOrderImage(data.orderNo, dataUrl);
    renderOrders();
    document.getElementById('orderImgPreview').src = dataUrl;
    document.getElementById('orderImgModal').classList.add('show');
  } catch (e) { showToast('生成失败：' + e.message); }
}

function closeOrderImg() { document.getElementById('orderImgModal').classList.remove('show'); }

function loadImage(src) {
  return new Promise((resolve) => {
    if (!src) { resolve(null); return; }
    const img = new Image();
    img.crossOrigin = 'anonymous';
    let done = false;
    img.onload = () => { if (!done) { done = true; resolve(img); } };
    img.onerror = () => { if (!done) { done = true; resolve(null); } };
    setTimeout(() => { if (!done) { done = true; resolve(null); } }, 10000);
    img.src = src;
  });
}

function copyWechat() {
  const wx = 'dageni2013';
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(wx).then(() => showToast('已复制微信号：' + wx)).catch(() => fallbackCopyWx(wx));
  } else fallbackCopyWx(wx);
}
function fallbackCopyWx(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); showToast('已复制微信号：' + text); } catch(e) {}
  document.body.removeChild(ta);
}

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ==================== 图片预览 ====================
let imgScale = 1, imgPanX = 0, imgPanY = 0;
let previewImages = [];
let thumbImages = [];
let previewIndex = 0, isAnimating = false;
let slideOffset = 0;
let touchMode = 'idle', startTouchX = 0, startTouchY = 0, startPanX = 0, startPanY = 0;
let pinchStartDist = 0, pinchStartScale = 1, startTime = 0;

function updateSlideTransforms(animate) {
  const prevEl = document.getElementById('imgPrevImg');
  const currEl = document.getElementById('imgPreviewSrc');
  const nextEl = document.getElementById('imgNextImg');
  if (!prevEl || !currEl || !nextEl) return;
  const W = window.innerWidth;
  const trans = animate ? 'transform 0.32s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.2s' : 'none';
  prevEl.style.transition = trans;
  currEl.style.transition = trans;
  nextEl.style.transition = trans;

  if (imgScale > 1.02) {
    prevEl.style.opacity = '0';
    nextEl.style.opacity = '0';
    currEl.style.transform = `translate(-50%, -50%) translateX(${imgPanX}px) translateY(${imgPanY}px) scale(${imgScale})`;
    return;
  }

  const hasPrev = previewIndex > 0;
  const hasNext = previewIndex < previewImages.length - 1;

  prevEl.style.opacity = hasPrev ? '1' : '0';
  nextEl.style.opacity = hasNext ? '1' : '0';

  currEl.style.transform = `translate(-50%, -50%) translateX(${slideOffset}px) scale(1)`;
  prevEl.style.transform = `translate(-50%, -50%) translateX(${slideOffset - W}px) scale(1)`;
  nextEl.style.transform = `translate(-50%, -50%) translateX(${slideOffset + W}px) scale(1)`;
}

function updateSlideImages() {
  const prevEl = document.getElementById('imgPrevImg');
  const currEl = document.getElementById('imgPreviewSrc');
  const nextEl = document.getElementById('imgNextImg');
  if (!prevEl || !currEl || !nextEl) return;
  currEl.src = previewImages[previewIndex] || '';
  prevEl.src = previewIndex > 0 ? previewImages[previewIndex - 1] : '';
  nextEl.src = previewIndex < previewImages.length - 1 ? previewImages[previewIndex + 1] : '';
}

function resetTransform() {
  imgScale = 1; imgPanX = 0; imgPanY = 0; slideOffset = 0;
  updateSlideTransforms(true);
}

function preloadAdjacent() {
  for (let off = -3; off <= 3; off++) {
    if (off === 0) continue;
    const idx = previewIndex + off;
    if (idx >= 0 && idx < previewImages.length) new Image().src = previewImages[idx];
  }
}

function preloadAllPreviewImages() {
  previewImages.forEach(url => {
    if (!url) return;
    const img = new Image();
    img.src = url;
  });
}

function renderThumbs() {
  const box = document.getElementById('imgThumbs');
  if (previewImages.length <= 1) {
    box.classList.remove('show');
    box.innerHTML = '';
    return;
  }
  box.classList.add('show');
  box.innerHTML = thumbImages.map((url, i) =>
    `<img class="img-thumb${i === previewIndex ? ' active' : ''}" src="${url}" onclick="gotoImage(${i})" onerror="this.style.opacity=0.2">`
  ).join('');
  setTimeout(scrollThumbIntoView, 20);
}

function scrollThumbIntoView() {
  const box = document.getElementById('imgThumbs');
  if (!box) return;
  const active = box.querySelector('.img-thumb.active');
  if (!active) return;
  const target = active.offsetLeft - box.clientWidth / 2 + active.clientWidth / 2;
  box.scrollTo({ left: target, behavior: 'smooth' });
}

function updateThumbsActive() {
  const box = document.getElementById('imgThumbs');
  const thumbs = box.querySelectorAll('.img-thumb');
  thumbs.forEach((t, i) => {
    if (i === previewIndex) t.classList.add('active');
    else t.classList.remove('active');
  });
  scrollThumbIntoView();
}

function gotoImage(idx) {
  if (idx === previewIndex) return;
  const dir = idx > previewIndex ? 1 : -1;
  animateSwitchTo(idx, dir);
}

function animateSwitchTo(newIndex, direction) {
  if (isAnimating) return;
  if (newIndex < 0 || newIndex >= previewImages.length) return;
  isAnimating = true;
  previewIndex = newIndex;
  updateSlideImages();
  slideOffset = -direction * window.innerWidth;
  updateSlideTransforms(false);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    slideOffset = 0;
    updateSlideTransforms(true);
    updateCounter();
    updateThumbsActive();
    preloadAdjacent();
    setTimeout(() => { isAnimating = false; }, 340);
  }));
}

function openImgPreview(source, index) {
  let list;
  if (source === 'home') list = currentHomeProducts;
  else if (source === 'cat') list = currentCatProducts;
  else if (source === 'cart') list = cartItems();
  else list = [];
  const valid = list.filter(p => p.img);
  previewImages = valid.map(p => preview(p.img));
  thumbImages = valid.map(p => thumb(p.img, 200));
  if (!previewImages.length) return;
  previewIndex = Math.max(0, Math.min(index || 0, previewImages.length - 1));
  slideOffset = 0;
  imgScale = 1; imgPanX = 0; imgPanY = 0;
  updateSlideImages();
  document.getElementById('imgPreview').classList.add('show');
  updateSlideTransforms(false);
  updateCounter();
  renderThumbs();
  preloadAdjacent();
  preloadAllPreviewImages();
  try {
    if (!history.state || !history.state.__imgPreview) {
      history.pushState({ __imgPreview: true }, '');
    }
  } catch (e) {}
}

function updateCounter() {
  const counter = document.getElementById('imgCounter');
  const prevBtn = document.getElementById('imgPrev');
  const nextBtn = document.getElementById('imgNext');
  if (previewImages.length > 1) {
    counter.textContent = (previewIndex + 1) + ' / ' + previewImages.length;
    counter.style.display = 'block';
    prevBtn.style.display = previewIndex > 0 ? 'flex' : 'none';
    nextBtn.style.display = previewIndex < previewImages.length - 1 ? 'flex' : 'none';
  } else { counter.style.display = 'none'; prevBtn.style.display = 'none'; nextBtn.style.display = 'none'; }
}

function nextImage() { if (previewIndex < previewImages.length - 1) animateSwitchTo(previewIndex + 1, 1); }
function prevImage() { if (previewIndex > 0) animateSwitchTo(previewIndex - 1, -1); }

function closeImgPreview() {
  const wasOpen = document.getElementById('imgPreview').classList.contains('show');
  document.getElementById('imgPreview').classList.remove('show');
  resetTransform();
  document.getElementById('imgThumbs').classList.remove('show');
  if (wasOpen && history.state && history.state.__imgPreview) {
    try { history.back(); } catch (e) {}
  }
}

function getTouchDistance(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

(function initImgPreviewEvents() {
  const preview = document.getElementById('imgPreview');
  const img = document.getElementById('imgPreviewSrc');
  if (!preview || !img) return;

  img.addEventListener('touchstart', function(e) {
    if (isAnimating) return;
    if (e.touches.length === 2) {
      touchMode = 'pinch';
      pinchStartDist = getTouchDistance(e.touches);
      pinchStartScale = imgScale;
      updateSlideTransforms(false);
      e.preventDefault();
    } else if (e.touches.length === 1) {
      startTouchX = e.touches[0].clientX;
      startTouchY = e.touches[0].clientY;
      startTime = Date.now();
      if (imgScale > 1.02) {
        touchMode = 'pan';
        startPanX = startTouchX - imgPanX;
        startPanY = startTouchY - imgPanY;
      } else {
        touchMode = 'swipe';
        slideOffset = 0;
      }
    }
  }, { passive: false });

  img.addEventListener('touchmove', function(e) {
    if (isAnimating) return;
    if (touchMode === 'pinch' && e.touches.length === 2) {
      const dist = getTouchDistance(e.touches);
      let ns = pinchStartScale * (dist / pinchStartDist);
      imgScale = Math.max(1, Math.min(5, ns));
      if (imgScale <= 1.02) { imgPanX = 0; imgPanY = 0; }
      updateSlideTransforms(false);
      e.preventDefault();
    } else if (touchMode === 'pan' && e.touches.length === 1) {
      imgPanX = e.touches[0].clientX - startPanX;
      imgPanY = e.touches[0].clientY - startPanY;
      updateSlideTransforms(false);
      e.preventDefault();
    } else if (touchMode === 'swipe' && e.touches.length === 1) {
      slideOffset = e.touches[0].clientX - startTouchX;
      const atStart = previewIndex === 0;
      const atEnd = previewIndex === previewImages.length - 1;
      if ((atStart && slideOffset > 0) || (atEnd && slideOffset < 0)) slideOffset *= 0.35;
      updateSlideTransforms(false);
      e.preventDefault();
    }
  }, { passive: false });

  img.addEventListener('touchend', function(e) {
    if (isAnimating) { touchMode = 'idle'; return; }
    if (touchMode === 'swipe') {
      const dt = Date.now() - startTime;
      const velocity = Math.abs(slideOffset) / dt;
      const threshold = window.innerWidth * 0.22;
      const shouldSwitch = Math.abs(slideOffset) > threshold || (velocity > 0.5 && Math.abs(slideOffset) > 40);
      if (shouldSwitch) {
        const direction = slideOffset < 0 ? 1 : -1;
        const newIdx = previewIndex + direction;
        if (newIdx >= 0 && newIdx < previewImages.length) {
          isAnimating = true;
          slideOffset = -direction * window.innerWidth;
          updateSlideTransforms(true);
          setTimeout(() => {
            previewIndex = newIdx;
            slideOffset = 0;
            updateSlideImages();
            updateSlideTransforms(false);
            updateCounter();
            updateThumbsActive();
            preloadAdjacent();
            isAnimating = false;
          }, 340);
        } else {
          slideOffset = 0;
          updateSlideTransforms(true);
        }
      } else {
        slideOffset = 0;
        updateSlideTransforms(true);
      }
    } else if (touchMode === 'pan' && imgScale <= 1.02) {
      imgScale = 1; imgPanX = 0; imgPanY = 0;
      updateSlideTransforms(true);
    } else if (touchMode === 'pinch' && imgScale <= 1.02) {
      imgScale = 1; imgPanX = 0; imgPanY = 0;
      updateSlideTransforms(true);
    }
    touchMode = 'idle';
  });

  img.addEventListener('mousedown', function(e) {
    if (imgScale > 1.02) {
      e.preventDefault();
      const sx = e.clientX - imgPanX, sy = e.clientY - imgPanY;
      img.style.cursor = 'grabbing';
      function onMove(ev) { imgPanX = ev.clientX - sx; imgPanY = ev.clientY - sy; updateSlideTransforms(false); }
      function onUp() { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); img.style.cursor = 'zoom-in'; }
      document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp);
    }
  });

  preview.addEventListener('wheel', function(e) {
    e.preventDefault();
    if (isAnimating) return;
    let ns = imgScale + (e.deltaY < 0 ? 0.2 : -0.2);
    imgScale = Math.max(1, Math.min(5, ns));
    if (imgScale <= 1.02) { imgScale = 1; imgPanX = 0; imgPanY = 0; }
    updateSlideTransforms(false);
  }, { passive: false });

  document.addEventListener('keydown', function(e) {
    if (!document.getElementById('imgPreview').classList.contains('show')) return;
    if (e.key === 'ArrowLeft') prevImage();
    else if (e.key === 'ArrowRight') nextImage();
    else if (e.key === 'Escape') closeImgPreview();
  });

  preview.addEventListener('click', function(e) {
    if (e.target.closest('#imgPrev') || e.target.closest('#imgNext')) return;
    if (e.target.closest('#imgThumbs') || e.target.closest('#imgCounter')) return;
    closeImgPreview();
  });
})();

window.addEventListener('popstate', function() {
  const previewEl = document.getElementById('imgPreview');
  if (previewEl && previewEl.classList.contains('show')) {
    previewEl.classList.remove('show');
    resetTransform();
    document.getElementById('imgThumbs').classList.remove('show');
  }
});

init();
</script>
